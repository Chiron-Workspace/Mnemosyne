[package]
name = "backend"
version = "0.1.0"
edition.workspace = true

[dependencies]
actix-web = "4.14.0"
async-trait = "0.1.81"
chrono = { version = "0.4.45", default-features = false, features = ["serde", "clock", "std"] }
dotenvy = "0.15.7"
mnemosyne-core = { path = "../mnemosyne-core" }
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sqlx = { version = "0.9.0", features = ["postgres", "runtime-tokio", "chrono", "uuid"] }
tokio = { version = "1.52.3", features = ["full"] }
uuid = { version = "1.23.4", features = ["serde"] }
